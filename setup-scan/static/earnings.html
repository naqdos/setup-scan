<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>earnings</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b0d0e; --panel: #14171a; --line: #262b2f;
    --amber: #f5a623; --green: #3ddc84; --red: #ff5c5c;
    --text: #d8dadc; --muted: #7a8288;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: 'JetBrains Mono', monospace; min-height: 100vh; }
  .wrap { max-width: 700px; margin: 0 auto; padding: 48px 20px 80px; }
  .brand { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 14px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
  .brand a { color: var(--muted); text-decoration: none; border-bottom: 1px dotted var(--muted); margin-right: 10px; }
  h1 { font-family: 'Space Grotesk', sans-serif; font-weight: 500; font-size: 28px; margin: 0 0 8px; }
  .subhead { color: var(--muted); font-size: 13px; margin-bottom: 28px; }
  .status { color: var(--muted); font-size: 13px; padding: 20px 0; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  thead th { text-align: left; color: var(--muted); text-transform: uppercase; font-size: 10px; letter-spacing: 0.06em; font-weight: 500; padding: 8px 10px; border-bottom: 1px solid var(--line); }
  tbody td { padding: 10px; border-bottom: 1px solid var(--line); }
  tbody tr:hover { background: var(--panel); }
  .ticker-cell { font-family: 'Space Grotesk', sans-serif; font-weight: 700; color: var(--text); }
  .soon { color: var(--red); } .later { color: var(--amber); }
  .empty { color: var(--muted); font-style: italic; padding: 20px 0; }
</style>
</head>
<body>
<div class="wrap">
  <div class="brand"><a href="/">single scan</a><a href="/scan">daily scan</a><a href="/movers">movers</a></div>
  <h1>Upcoming earnings</h1>
  <div class="subhead">Watchlist tickers reporting within the next 7 days.</div>

  <div class="status" id="status">Loading...</div>
  <table id="table" style="display:none">
    <thead><tr><th>Ticker</th><th>Earnings Date</th><th>Days Away</th></tr></thead>
    <tbody id="tbody"></tbody>
  </table>
</div>

<script>
async function load() {
  const statusEl = document.getElementById('status');
  const table = document.getElementById('table');
  const tbody = document.getElementById('tbody');
  try {
    const res = await fetch('/api/earnings');
    const data = await res.json();
    if (!res.ok || data.error) throw new Error(data.error || 'Request failed');

    const ok = data.results.filter(r => !r.error);
    if (ok.length === 0) {
      statusEl.textContent = 'No watchlist tickers report earnings in the next 7 days.';
      statusEl.className = 'empty';
      return;
    }

    tbody.innerHTML = '';
    for (const r of ok) {
      const tr = document.createElement('tr');
      const cls = r.days_away <= 2 ? 'soon' : 'later';
      tr.innerHTML = `
        <td class="ticker-cell">${r.ticker}</td>
        <td>${r.earnings_date}</td>
        <td class="${cls}">${r.days_away === 0 ? 'Today' : r.days_away + 'd'}</td>
      `;
      tbody.appendChild(tr);
    }
    statusEl.style.display = 'none';
    table.style.display = 'table';
  } catch (err) {
    statusEl.textContent = `Error: ${err.message}`;
  }
}
load();
</script>
</body>
</html>
